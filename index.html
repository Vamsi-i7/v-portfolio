<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0B" />
    <meta name="google-site-verification" content="0a2DZoE8ZwvCQXnWOr_N7WRf6NZSxRHJyHiwfBQjUTM" />

    <!-- Primary SEO meta tags are injected dynamically via react-helmet-async -->

    <!-- Devicon for Technology Logos -->
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css" />

    <!--
      Font preloads: Self-hosted Inter and JetBrains Mono.
      Only the weights used above the fold are preloaded (400 for body, 800 for hero headline).
      Additional weights are loaded via @font-face in index.css.
    -->
    <link
      rel="preload"
      href="/fonts/inter-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-800-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
